# CF优选IP（域名版）Docker Compose 示例
# 先拉镜像（或改成 :latest 用最新版），再 up：
#   docker compose up -d
# 打开 http://NAS-IP:18089，默认账号 admin / 密码 admin，首次登录后请改掉。
services:
  cf-bestipd:
    image: ghcr.io/liweisi07/cf-bestip-domain:1.0.22
    container_name: cf-bestipd
    ports:
      - "18089:18089"
    volumes:
      - ./data:/data
    restart: unless-stopped
